<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copetti Charts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f0f14;
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #888;
        }
        .chart-container {
            background: #1a1a24;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        canvas {
            display: block;
        }
        .controls {
            margin-top: 16px;
            display: flex;
            gap: 12px;
        }
        button {
            background: #26a69a;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #2bbbad;
        }
    </style>
</head>
<body>
    <h1>Copetti Charts</h1>
    <div class="chart-container">
        <canvas id="chart"></canvas>
    </div>
    <div class="controls">
        <button id="randomize">Randomize Data</button>
    </div>
    <script type="module" src="/app.js"></script>
</body>
</html>
